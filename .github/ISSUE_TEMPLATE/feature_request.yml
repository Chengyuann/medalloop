name: Feature request
description: Improve competition research, experiments, validation or ensembling.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow failure or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful behavior
      description: Describe the competition workflow, expected benefit and authorization boundaries.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or example
      description: Prefer a synthetic example with an expected outcome.
