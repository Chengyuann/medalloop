[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medalloop"
version = "0.2.0"
description = "An agent iteration framework for machine-learning competitions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chengyuan Ma"}]
keywords = ["agents", "competitions", "kaggle", "machine-learning", "ensembling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
medalloop = "medalloop.cli:main"
evidence-loop = "medalloop.cli:main"

[project.urls]
Homepage = "https://github.com/Chengyuann/medalloop"
Repository = "https://github.com/Chengyuann/medalloop"
Issues = "https://github.com/Chengyuann/medalloop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medalloop = ["templates/*.json", "templates/*.py", "templates/*.md", "templates/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
