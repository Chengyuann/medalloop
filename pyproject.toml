[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-loop"
version = "0.1.0"
description = "A local, evidence-first experiment loop for coding agents and researchers."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chengyuan Ma"}]
keywords = ["agents", "experiments", "reproducibility", "machine-learning", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
evidence-loop = "evidence_loop.cli:main"

[project.urls]
Homepage = "https://github.com/Chengyuann/evidence-loop"
Repository = "https://github.com/Chengyuann/evidence-loop"
Issues = "https://github.com/Chengyuann/evidence-loop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_loop = ["templates/*.json", "templates/*.py", "templates/*.md", "templates/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
